---
- name: Setup Flask App Server
  hosts: all
  become: yes

  tasks:

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Git
      yum:
        name: git
        state: present

    - name: Clone GitHub repository
      git:
        repo: https://github.com/kavithapremji91/devops-assignment.git
        dest: /home/ec2-user/devops-assignment

    - name: Build Docker image
      command: docker build -t flask-app .
      args:
        chdir: /home/ec2-user/devops-assignment

    - name: Run Docker container
      command: docker run -d -p 80:5000 flask-app
